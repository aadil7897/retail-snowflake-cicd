name: CD - DEV
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install snowflake-cli

      - name: Write private key
        env:
          PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          printf '%s' "$PRIVATE_KEY" > "$RUNNER_TEMP/rsa_key.p8"
          chmod 600 "$RUNNER_TEMP/rsa_key.p8"

      - name: Configure Snowflake CLI
        env:
          ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          USER_NAME: ${{ secrets.SNOWFLAKE_USER }}
        run: |
          mkdir -p ~/.snowflake
          cat > ~/.snowflake/config.toml <<EOF
          [connections.cicd]
          account = "$ACCOUNT"
          user = "$USER_NAME"
          role = "RETAIL_DEV_DEPLOYER"
          warehouse = "RETAIL_DEV_WH"
          database = "RETAIL_DEV"
          authenticator = "SNOWFLAKE_JWT"
          private_key_file = "$RUNNER_TEMP/rsa_key.p8"
          EOF
          chmod 600 ~/.snowflake/config.toml

      - name: Test connection
        env:
          PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
        run: snow connection test -c cicd

      - name: Deploy
        env:
          PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
        run: snow sql -c cicd -f database/001_control.sql

      - name: Smoke test
        env:
          PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
        run: snow sql -c cicd -f tests/01_smoke.sql
